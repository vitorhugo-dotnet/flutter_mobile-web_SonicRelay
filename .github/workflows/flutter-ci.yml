name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  ANDROID_VERSION_CODE_OFFSET: "100000"

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release eligibility
        id: version
        shell: bash
        run: |
          VERSION_DECLARATION=$(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)

          if [[ -z "$VERSION_DECLARATION" ]]; then
            echo "Unable to read version from pubspec.yaml." >&2
            exit 1
          fi

          VERSION_NAME="${VERSION_DECLARATION%%+*}"

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Releases require a versionName in major.minor.patch format, found '$VERSION_NAME'." >&2
            exit 1
          fi

          CURRENT_VERSION_CODE=0
          if [[ "$VERSION_DECLARATION" == *+* ]]; then
            CURRENT_VERSION_CODE="${VERSION_DECLARATION##*+}"
          fi

          if [[ ! "$CURRENT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number in pubspec.yaml: '$CURRENT_VERSION_CODE'." >&2
            exit 1
          fi

          LATEST_TAG_VERSION_CODE=$(
            git tag --list 'v*+*' \
              | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' \
              | sort -n \
              | tail -n 1
          )
          LATEST_TAG_VERSION_CODE="${LATEST_TAG_VERSION_CODE:-0}"

          VERSION_CODE=$((ANDROID_VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))

          if (( VERSION_CODE <= CURRENT_VERSION_CODE )); then
            VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          fi

          if (( VERSION_CODE <= LATEST_TAG_VERSION_CODE )); then
            VERSION_CODE=$((LATEST_TAG_VERSION_CODE + 1))
          fi

          TAG="v${VERSION_NAME}+${VERSION_CODE}"
          SHOULD_RELEASE=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            SHOULD_RELEASE=true
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

          echo "Resolved release: $TAG"
          echo "Release eligible: $SHOULD_RELEASE"

  checks:
    name: ${{ matrix.task == 'analyze' && 'Analyze' || 'Test' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.task == 'analyze'
        run: flutter analyze

      - name: Test
        if: matrix.task == 'test'
        run: flutter test

  build-android:
    name: Build Android APK and AAB
    needs: [checks, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # F-Droid's build server applies the same patch when rebuilding from
      # source to verify Reproducible Builds; without it here too, the two
      # builds' build-id notes diverge and the byte-for-byte comparison
      # never matches.
      - name: Strip build-id from native libs for reproducible builds
        run: |
          sed -i -e '1a add_link_options("LINKER:--build-id=none")' $HOME/.pub-cache/hosted/pub.dev/flutter_zxing-*/*/CMakeLists.txt
          sed -i -e '/^project(/a add_link_options("LINKER:--build-id=none")' $HOME/.pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Validate signing secrets
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Create Android signing files
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --flavor play \
            --build-name "${{ needs.version.outputs.version_name }}" \
            --build-number "${{ needs.version.outputs.version_code }}"

      - name: Build release AAB
        run: |
          flutter build appbundle \
            --release \
            --flavor play \
            --build-name "${{ needs.version.outputs.version_name }}" \
            --build-number "${{ needs.version.outputs.version_code }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-relay-apk
          path: build/app/outputs/flutter-apk/app-play-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-relay-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      # Same flavor and split scheme F-Droid's build server produces from
      # source, published so `Binaries`/`binary:` in the F-Droid metadata can
      # verify a byte-for-byte match and adopt this signing key.
      - name: Build release APKs (F-Droid, split per ABI)
        run: |
          flutter build apk \
            --release \
            --flavor fdroid \
            --split-per-abi \
            --build-name "${{ needs.version.outputs.version_name }}" \
            --build-number "${{ needs.version.outputs.version_code }}"

      - name: Upload F-Droid APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonic-relay-fdroid-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk
            build/app/outputs/flutter-apk/app-x86_64-fdroid-release.apk
          if-no-files-found: error

  build-web:
    name: Build web (WebAssembly)
    needs: [checks, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `--wasm` emits both the WasmGC bundle and a dart2js bundle; `flutter.js`
      # picks between them per browser, so browsers without WasmGC still load.
      # Pages serves this repository from `/<repo>/`, never the domain root, so
      # the base href is derived from the repository name and survives a rename.
      - name: Build web
        run: |
          flutter build web \
            --wasm \
            --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --build-name "${{ needs.version.outputs.version_name }}" \
            --build-number "${{ needs.version.outputs.version_code }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy web to GitHub Pages
    # The three gates asked for, plus the build that produces the artifact:
    # nothing reaches Pages unless the version resolves and analyze and test
    # both pass.
    needs: [version, checks, build-web]
    # Pages has one production site, so only main publishes to it. A pull
    # request still builds above, which is what catches web breakage early.
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The workflow-level group is keyed by ref; Pages allows one deployment at
    # a time across the whole site, so this one is keyed by the site.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Persist version and publish GitHub Release
    needs: [version, checks, build-android]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.persist_version.outputs.sha }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sonic-relay-apk
          path: dist

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: sonic-relay-aab
          path: dist

      - name: Download F-Droid APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonic-relay-fdroid-apks
          path: dist

      - name: Rename release artifacts
        run: |
          mv dist/app-play-release.apk "dist/sonic-relay-${{ needs.version.outputs.tag }}.apk"
          mv dist/app-play-release.aab "dist/sonic-relay-${{ needs.version.outputs.tag }}.aab"
          mv dist/app-armeabi-v7a-fdroid-release.apk "dist/sonic-relay-armeabi-v7a-fdroid-${{ needs.version.outputs.tag }}.apk"
          mv dist/app-arm64-v8a-fdroid-release.apk "dist/sonic-relay-arm64-v8a-fdroid-${{ needs.version.outputs.tag }}.apk"
          mv dist/app-x86_64-fdroid-release.apk "dist/sonic-relay-x86_64-fdroid-${{ needs.version.outputs.tag }}.apk"

      - name: Extract changelog for this release
        id: changelog
        shell: bash
        run: |
          NOTES_FILE="dist/release-notes.md"
          sed -E '/^<\/[^>]+>$/d; s/^<([^>]+)>$/### \1/' CHANGELOG.xml > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]] || ! grep -q '^### en-US$' "$NOTES_FILE"; then
            echo "CHANGELOG.xml is missing or could not be converted to GitHub Release Markdown." >&2
            exit 1
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Persist release version in pubspec.yaml
        id: persist_version
        shell: bash
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          EXPECTED_VERSION="${VERSION_NAME}+${VERSION_CODE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags

          REMOTE_SHA=$(git rev-parse origin/main)

          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            REMOTE_VERSION=$(git show origin/main:pubspec.yaml | sed -nE 's/^version:[[:space:]]*//p' | head -n 1)
            REMOTE_PARENT=$(git rev-parse origin/main^ 2>/dev/null || true)

            if [[ "$REMOTE_VERSION" == "$EXPECTED_VERSION" && "$REMOTE_PARENT" == "$GITHUB_SHA" ]]; then
              echo "Release version commit already exists at $REMOTE_SHA."
              echo "sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "main moved from $GITHUB_SHA to $REMOTE_SHA while the release was running." >&2
            echo "Refusing to tag or overwrite a newer commit." >&2
            exit 1
          fi

          sed -i -E "s/^version:.*/version: ${EXPECTED_VERSION}/" pubspec.yaml

          ACTUAL_VERSION=$(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Failed to persist release version '$EXPECTED_VERSION'." >&2
            exit 1
          fi

          if git diff --quiet -- pubspec.yaml; then
            RELEASE_SHA=$(git rev-parse HEAD)
          else
            git add pubspec.yaml
            git commit -m "chore(release): persist ${EXPECTED_VERSION}"
            git push origin HEAD:main
            RELEASE_SHA=$(git rev-parse HEAD)
          fi

          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ steps.persist_version.outputs.sha }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            dist/sonic-relay-${{ needs.version.outputs.tag }}.apk
            dist/sonic-relay-${{ needs.version.outputs.tag }}.aab
            dist/sonic-relay-armeabi-v7a-fdroid-${{ needs.version.outputs.tag }}.apk
            dist/sonic-relay-arm64-v8a-fdroid-${{ needs.version.outputs.tag }}.apk
            dist/sonic-relay-x86_64-fdroid-${{ needs.version.outputs.tag }}.apk

  deploy-play:
    name: Deploy Google Play internal testing
    needs: [version, release]
    if: needs.version.outputs.should_release == 'true'
    uses: ./.github/workflows/android-play-deploy.yml
    with:
      version_name: ${{ needs.version.outputs.version_name }}
      version_code: ${{ needs.version.outputs.version_code }}
      source_ref: ${{ needs.release.outputs.release_commit }}
    secrets: inherit
