<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced at build time by the `--base-href` argument, which the workflow
    always passes. It is `/` while `web/CNAME` names a custom domain, because
    Pages then serves the site from that domain's root, and `/<repo>/` on the
    bare `github.io` URL.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SonicRelay viewer: join a session and listen to low-latency audio streamed from a SonicRelay publisher.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SonicRelay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SonicRelay</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
